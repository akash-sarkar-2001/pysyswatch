[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysyswatch"
version = "0.1.0"
description = "Production-Grade Linux System Monitoring & Diagnostics Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[project.scripts]
pysyswatch = "pysyswatch.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "httpx>=0.26.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.mypy]
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false